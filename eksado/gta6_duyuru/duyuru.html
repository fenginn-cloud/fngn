<!doctype html><html><head><meta charset="utf-8"><style>
/* EKSADO – "Sevkiyat biriminden duyuru" 12 sn yazı animasyonu (1080x1920, beyaz zemin, Instagram Reels güvenli alanı içinde) */
html,body{margin:0;width:1080px;height:1920px;background:#fff;overflow:hidden;color:#111;font-family:'Inter Display','Inter',sans-serif}
#wrap{position:absolute;left:84px;top:300px;width:830px}
#hdr{font:800 40px/1 'Inter Display';letter-spacing:.04em;opacity:0}
#body{margin-top:58px;font:500 60px/1.2 'Inter Display';letter-spacing:-.015em}
#big{margin-top:66px;font:800 88px/1.05 'Inter Display';letter-spacing:-.035em}
.w{display:inline-block;opacity:0;will-change:transform}
#art{position:absolute;left:84px;top:1000px;width:640px;height:350px;overflow:visible}
#art *{fill:none;stroke:#111;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
#art .thick{stroke-width:5}
#art .thin{stroke-width:2.2}
#brand{position:absolute;left:84px;top:1385px;font:500 50px/1 'Inter Display';letter-spacing:.02em;opacity:0}
</style></head><body>
<div id="wrap">
  <div id="hdr">SEVKİYAT BİRİMİNDEN DUYURU</div>
  <div id="body"></div>
  <div id="big"></div>
</div>
<svg id="art" viewBox="-20 0 640 350"></svg>
<div id="brand">EKSADO</div>
<script>
const c=x=>Math.min(1,Math.max(0,x)), eo=x=>1-Math.pow(1-c(x),3);
const back=x=>{x=c(x);const s=1.7;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);};
// ---- metin: kelime kelime ----
const LINES=['GTA 6’nın çıkışıyla birlikte','“Vice City’ye tiny house','gönderiyor musunuz?”','sorusu gelmeye başladı.'];  // satırlar görseldeki gibi
const BIG='Konum atın, bakalım.'.split(' ');
const bodyEl=document.getElementById('body'), bigEl=document.getElementById('big');
bodyEl.innerHTML=LINES.map(l=>l.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ')).join('<br>');
bigEl.innerHTML=BIG.map(w=>`<span class="w">${w}</span>`).join(' ');
const bodyW=[...bodyEl.children], bigW=[...bigEl.children];
// ---- çizim: tiny house + palmiye (her parça [başlangıç, süre]) ----
const svg0=document.getElementById('art'), NS='http://www.w3.org/2000/svg', parts=[];
let svg=svg0;
const palm=document.createElementNS(NS,'g');palm.setAttribute('transform','translate(44,0)');svg0.appendChild(palm);
function P(d,t0,dur,cls){const p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('pathLength','1');
  p.setAttribute('stroke-dasharray','1 1');if(cls)p.setAttribute('class',cls);svg.appendChild(p);parts.push([p,t0,dur]);}
const T0=5.75;
P('M-15,296 L512,296',T0,.5,'thin');                                   // zemin
P('M0,252 L362,252 L362,264 L0,264 Z',T0+.15,.45);                      // römork tablası
P('M0,258 L-16,262',T0+.45,.15);                                        // çeki demiri
P('M112,276 m-17,0 a17,17 0 1,0 34,0 a17,17 0 1,0 -34,0',T0+.45,.4);   // tekerlekler
P('M152,276 m-17,0 a17,17 0 1,0 34,0 a17,17 0 1,0 -34,0',T0+.55,.4);
P('M112,276 m-5,0 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0',T0+.8,.2,'thin');
P('M152,276 m-5,0 a5,5 0 1,0 10,0 a5,5 0 1,0 -10,0',T0+.85,.2,'thin');
P('M14,252 L14,108 L300,66 L334,112 L334,252',T0+.3,.7);                // gövde
P('M-2,106 L300,58 L352,116',T0+.75,.45,'thick');                       // eğimli çatı
P('M148,252 L148,86',T0+1.0,.3);                                        // cephe bölmesi
for(let i=0;i<12;i++){const x=24+i*10.5, yt=108-(x-14)*(42/286)+5;      // dikey kaplama çizgileri
  P(`M${x},${yt} L${x},247`,T0+1.05+i*.035,.25,'thin');}
P('M40,154 L82,154 L82,248 L40,248 Z',T0+1.3,.35);                      // kapı
P('M74,202 L74,203',T0+1.6,.05,'thick');
P('M168,122 L318,104 L318,248 L168,248 Z',T0+1.35,.45);                 // büyük cam
P('M242,113 L242,124',T0+1.75,.1,'thin');                               // sarkıt lamba
P('M232,138 L252,138 L248,124 L236,124 Z',T0+1.8,.2,'thin');
P('M188,246 L188,222 Q188,214 196,214 L274,214 Q282,214 282,222 L282,246 M188,230 L282,230 M200,214 L200,206 Q200,200 206,200 L266,200 Q272,200 272,206 L272,214',T0+1.85,.45,'thin'); // koltuk
// palmiye (evin çatısına binmesin diye 44 birim sağda)
svg=palm;
P('M418,296 C410,240 398,170 388,74',T0+.9,.55,'thick');
for(let i=0;i<8;i++){const y=270-i*25, x=416-(i*3.6)-(i*i*.25);P(`M${x-6},${y} Q${x},${y-4} ${x+6},${y+1}`,T0+1.35+i*.04,.12,'thin');}
const FR=['M388,74 C360,52 330,56 306,82','M388,74 C366,40 336,32 312,40','M388,74 C384,40 368,18 348,10','M388,74 C400,40 424,22 452,22',
          'M388,74 C418,52 450,56 470,84','M388,74 C410,74 430,98 436,124','M388,74 C366,78 350,100 346,126'];
FR.forEach((d,i)=>P(d,T0+1.45+i*.07,.35));
FR.forEach((d,i)=>{ // yaprak dişleri
  P(d.replace(/^M388,74/,'M390,72'),T0+1.6+i*.07,.3,'thin');});
P('M434,296 L438,282 M442,296 L444,278 M450,296 L454,284 M402,296 L398,284',T0+2.0,.3,'thin'); // çimen
window.renderAt=t=>{
  const h=document.getElementById('hdr'), a=eo((t-.3)/.6);
  h.style.opacity=a; h.style.letterSpacing=(.18-.14*a)+'em'; h.style.transform=`translateY(${(1-a)*18}px)`;
  bodyW.forEach((el,i)=>{const s=1.0+i*.15, k=eo((t-s)/.38);el.style.opacity=k;
    el.style.transform=`translateY(${(1-k)*26}px)`;el.style.filter=`blur(${(1-k)*8}px)`;});
  bigW.forEach((el,i)=>{const s=4.75+i*.26, k=c((t-s)/.32);el.style.opacity=c(k*2);
    el.style.transform=`scale(${t<s?.7:.7+.3*back(k)})`;el.style.transformOrigin='0% 80%';});
  for(const [p,t0,d] of parts)p.style.strokeDashoffset=1-eo((t-t0)/d);
  const b=document.getElementById('brand'), k=eo((t-8.5)/.6);
  b.style.opacity=k; b.style.transform=`translateY(${(1-k)*16}px)`; b.style.letterSpacing=(.12-.1*k)+'em';
};
window.ready=true;</script></body></html>
