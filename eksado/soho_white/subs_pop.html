<!doctype html><html><head><meta charset="utf-8"><style>
/* Dinamik (kelime kelime) altyazı: o an söylenen kelime turuncu ve hafif büyük. Instagram Reels güvenli alanı korunur. */
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#box{position:absolute;left:70px;right:170px;bottom:480px;display:flex;justify-content:center;align-items:flex-end;text-align:center}
#s{font:900 74px/1.2 'Inter Display','Inter',sans-serif;letter-spacing:-.02em;color:#fff;opacity:0;
   text-shadow:0 0 4px rgba(0,0,0,.75),0 4px 0 rgba(0,0,0,.35),0 2px 26px rgba(0,0,0,.65);-webkit-text-stroke:2px rgba(0,0,0,.35)}
.w{display:inline-block;transition:none;margin:0 .12em}
.w.on{color:#FF8A2A;transform:scale(1.12)}
.hl{display:inline-block;background:#EC7520;color:#fff;padding:2px 20px 8px;border-radius:18px;text-shadow:none;-webkit-text-stroke:0;
    box-shadow:0 6px 24px rgba(0,0,0,.3);margin:0 .1em}
.hl.on{color:#fff;background:#FF7A10;transform:scale(1.1)}
#s.dark{color:#1d1d1f;text-shadow:none;-webkit-text-stroke:0}
#s.dark .w.on{color:#EC7520}
#s.sm{font-size:58px}
</style></head><body><div id="box"><div id="s"></div></div><script>
// SUBS_JSON: [[başlangıç, bitiş, sınıf, [[kelime, kelime_başı, kelime_sonu, 'hl'|''], ...]], ...]
const SUBS=window.SUBS_JSON||[];const el=document.getElementById('s');const c=x=>Math.min(1,Math.max(0,x));
window.renderAt=(t)=>{const s=SUBS.find(([a,b])=>t>=a&&t<=b);if(!s){el.style.opacity=0;return;}
  const [a,b,cls,ws]=s;
  if(el.dataset.k!==String(a)){el.className=cls||'';el.innerHTML=ws.map(([w,,,k])=>`<span class="${k==='hl'?'hl':'w'}">${w}</span>`).join(' ');el.dataset.k=String(a);}
  const spans=el.children;let cur=-1;ws.forEach(([,s0],i)=>{if(t>=s0-.04)cur=i;});
  for(let i=0;i<spans.length;i++)spans[i].classList.toggle('on',i===cur);
  const ai=c((t-a)/.1),o=c((b-t)/.08);el.style.opacity=Math.min(ai,o);
  el.style.transform=`scale(${.9+.1*(1-Math.pow(1-ai,3))})`;};
window.ready=true;</script></body></html>
