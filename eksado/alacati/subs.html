<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
/* Instagram Reels güvenli alanı: üst 250px, alt 480px, sağ 170px, sol 70px boş bırakılır */
#box{position:absolute;left:70px;right:170px;bottom:480px;display:flex;justify-content:center;align-items:flex-end;text-align:center}
#s{font:800 62px/1.18 'Inter Display','Inter',sans-serif;letter-spacing:-.02em;color:#fff;opacity:0;
   text-shadow:0 0 3px rgba(0,0,0,.65),0 3px 0 rgba(0,0,0,.3),0 2px 22px rgba(0,0,0,.6);-webkit-text-stroke:1px rgba(0,0,0,.15)}
.hl{display:inline-block;background:#EC7520;color:#fff;padding:2px 18px 6px;border-radius:16px;text-shadow:none;-webkit-text-stroke:0;box-shadow:0 6px 22px rgba(0,0,0,.25)}
#s.dark{color:#1d1d1f;text-shadow:none;-webkit-text-stroke:0}
.big{font-size:70px;margin:6px 0}
/* kapanış animasyonunda logo alt-ortada: altyazı yazılarla logo arasındaki boşluğa çıkar */
#box.mid{bottom:900px}
</style></head><body><div id="box"><div id="s"></div></div><script>
const SUBS=window.SUBS_JSON||[];const el=document.getElementById('s');const c=x=>Math.min(1,Math.max(0,x));
window.renderAt=(t)=>{const s=SUBS.find(([a,b])=>t>=a&&t<=b);if(!s){el.style.opacity=0;return;}
  if(el.dataset.k!==String(s[0])){el.innerHTML=s[2];el.className=s[3]||'';document.getElementById('box').className=(s[3]||'').includes('mid')?'mid':'';el.dataset.k=String(s[0]);}
  const a=c((t-s[0])/.12),o=c((s[1]-t)/.1);el.style.opacity=Math.min(a,o);
  el.style.transform=`translateY(${(1-a)*14}px) scale(${.94+.06*a})`;};
window.ready=true;</script></body></html>
